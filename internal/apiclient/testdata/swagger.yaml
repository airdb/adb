swagger: "2.0"
info:
  title: API CLI test
  version: "1"
host: example.invalid
basePath: /api
schemes: [https]
consumes: [application/json]
paths:
  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        type: string
      - name: limit
        in: query
        required: true
        type: integer
    post:
      operationId: createItem
      summary: Create a test item
      description: Sends a test JSON document.
      parameters:
        - name: X-Test
          in: header
          required: true
          type: string
        - name: tags
          in: query
          type: array
          items: {type: string}
          collectionFormat: multi
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/Item'
      responses:
        "200": {description: OK}
    get:
      operationId: getItem
      deprecated: true
      responses:
        "200": {description: OK}
  /duplicate:
    get:
      operationId: getItem
      deprecated: true
      responses:
        "200": {description: OK}
definitions:
  Item:
    type: object
    required: [name]
    properties:
      name:
        type: string
        example: demo
      state:
        type: string
        enum: [pending]
      details:
        $ref: '#/definitions/Details'
  Details:
    type: object
    properties:
      active: {type: boolean}
